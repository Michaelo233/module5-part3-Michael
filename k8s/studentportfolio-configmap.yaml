apiVersion: v1
data:
  Dockerfile: "# Use Nginx for static website\n\nFROM docker.io/library/nginx:alpine
    \n\n# Copy all site files into Nginx default web directory\n\nCOPY . /usr/share/nginx/html\n\n
    \n\nEXPOSE 80"
  index.html: "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n
    \   <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n
    \   <title>Michael Obikwere - Student Portfolio</title>\n    <!-- Bootstrap CSS
    CDN -->\n    <link href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css\"
    rel=\"stylesheet\">\n    <!-- Custom CSS -->\n    <link rel=\"stylesheet\" href=\"css/style.css\">\n</head>\n<body>\n
    \   <!-- Navbar -->\n    <nav class=\"navbar navbar-expand-lg navbar-dark bg-dark
    fixed-top\">\n        <div class=\"container\">\n            <a class=\"navbar-brand\"
    href=\"#\">Michael Obikwere</a>\n            <button class=\"navbar-toggler\"
    type=\"button\" data-bs-toggle=\"collapse\" data-bs-target=\"#navbarNav\">\n                <span
    class=\"navbar-toggler-icon\"></span>\n            </button>\n            <div
    class=\"collapse navbar-collapse\" id=\"navbarNav\">\n                <ul class=\"navbar-nav
    ms-auto\">\n                    <li class=\"nav-item\"><a class=\"nav-link\" href=\"#about\">About</a></li>\n
    \                   <li class=\"nav-item\"><a class=\"nav-link\" href=\"#projects\">Projects</a></li>\n
    \                   <li class=\"nav-item\"><a class=\"nav-link\" href=\"#skills\">Skills</a></li>\n
    \                   <li class=\"nav-item\"><a class=\"nav-link\" href=\"#contact\">Contact</a></li>\n
    \               </ul>\n            </div>\n        </div>\n    </nav>\n\n    <!--
    Hero Section -->\n    <section id=\"hero\" class=\"text-center text-white d-flex
    align-items-center\">\n        <div class=\"container\">\n            <h1>Welcome
    to My Portfolio I am deploying a microservice built in different programming language
    and connecting the services\n                via API so that the services can
    communicate with each other and use NGINX to serve as entrance into the application</h1>\n
    \           <p>Hi, I’m Michael Obikwere, Highly analytical and versatile Quality
    Assurance Lead with a unique background spanning SQL Development, Data Analytics,
    and Software Testing. \n                Leverages a deep understanding of data
    integrity, system architecture, and quality methodologies to deliver robust, high-performance
    software solutions, now seamlessly \n                integrating development responsibilities
    with QA leadership.</p>\n            <a href=\"#about\" class=\"btn btn-primary\">Learn
    More</a>\n        </div>\n    </section>\n\n    <!-- About Section -->\n    <section
    id=\"about\" class=\"py-5\">\n        <div class=\"container\">\n            <h2
    class=\"text-center mb-4\">About Me</h2>\n            <div class=\"row\">\n                <div
    class=\"col-md-4 text-center\">\n                    <img src=\"assets/Michael.jpg\"
    alt=\"Michael Obikwere\" class=\"rounded-circle mb-3\" width=\"200\">\n                </div>\n
    \               <div class=\"col-md-8\">\n                    <p>I’m a IT/DevOps
    instructor with a love for coding, problem-solving, and building projects that
    make a difference. I enjoy learning new technologies and collaborating with others
    to turn ideas into reality.</p>\n                </div>\n            </div>\n
    \       </div>\n    </section>\n\n    <!-- Projects Section -->\n    <section
    id=\"projects\" class=\"py-5 bg-light\">\n        <div class=\"container\">\n
    \           <h2 class=\"text-center mb-4\">Projects</h2>\n            <div class=\"row\">\n
    \               <div class=\"col-md-4 mb-4\">\n                    <div class=\"card\">\n
    \                       <div class=\"card-body\">\n                            <h5
    class=\"card-title\">Task Manager App</h5>\n                            <p class=\"card-text\">A
    simple app to organize tasks, built with Python and Tkinter.</p>\n                        </div>\n
    \                   </div>\n                </div>\n                <div class=\"col-md-4
    mb-4\">\n                    <div class=\"card\">\n                        <div
    class=\"card-body\">\n                            <h5 class=\"card-title\">Weather
    Dashboard</h5>\n                            <p class=\"card-text\">A web app showing
    live weather data using JavaScript and APIs.</p>\n                        </div>\n
    \                   </div>\n                </div>\n                <div class=\"col-md-4
    mb-4\">\n                    <div class=\"card\">\n                        <div
    class=\"card-body\">\n                            <h5 class=\"card-title\">Banking
    Webapp</h5>\n                            <p class=\"card-text\">This is a simple
    banking application with basic functions like withdraw, deposit and check balance</p>\n
    \                           <!-- <a href=\"/banking/\"target = \"_blank\">View
    Banking App</a> -->\n                            <a href=\"/api/login\">Banking
    App</a>\n                        </div>\n                    </div>\n                </div>\n
    \           </div>\n        </div>\n    </section>\n\n    <!-- Skills Section
    -->\n    <section id=\"skills\" class=\"py-5\">\n        <div class=\"container\">\n
    \           <h2 class=\"text-center mb-4\">Skills</h2>\n            <div class=\"row\">\n
    \               <div class=\"col-md-6\">\n                    <p>Python</p>\n
    \                   <div class=\"progress\">\n                        <div class=\"progress-bar\"
    style=\"width: 80%;\">80%</div>\n                    </div>\n                </div>\n
    \               <div class=\"col-md-6\">\n                    <p>HTML/CSS</p>\n
    \                   <div class=\"progress\">\n                        <div class=\"progress-bar\"
    style=\"width: 90%;\">90%</div>\n                    </div>\n                </div>\n
    \           </div>\n        </div>\n    </section>\n\n    <!-- Contact Footer
    -->\n    <footer id=\"contact\" class=\"bg-dark text-white text-center py-3\">\n
    \       <div class=\"container\">\n            <p>Contact me at: michael_obikwere@example.com
    | GitHub: github.com/MichaelObikwere</p>\n            <p>&copy; 2025 Michael Obikwere.
    All rights reserved.</p>\n        </div>\n    </footer>\n\n    <!-- Bootstrap
    JS CDN -->\n    <script src=\"https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js\"></script>\n</body>\n</html>"
kind: ConfigMap
metadata:
  name: studentportfolio-html
